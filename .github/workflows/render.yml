name: Render short

on:
  workflow_dispatch:
    inputs:
      shot:
        description: "Composition id to render (e.g. Short10Fees)"
        required: true
        default: "Short10Fees"
      scale:
        description: "1 = 1080x1920, 2 = 4K"
        required: true
        default: "1"
  push:
    paths:
      - "render-request.txt"

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Pick shot
        id: pick
        run: |
          SHOT="${{ github.event.inputs.shot }}"
          SCALE="${{ github.event.inputs.scale }}"
          if [ -z "$SHOT" ] && [ -f ../render-request.txt ]; then
            SHOT="$(head -1 ../render-request.txt | tr -d '[:space:]')"
          fi
          [ -z "$SHOT" ] && SHOT=Short10Fees
          [ -z "$SCALE" ] && SCALE=1
          echo "shot=$SHOT" >> "$GITHUB_OUTPUT"
          echo "scale=$SCALE" >> "$GITHUB_OUTPUT"
          echo "Rendering $SHOT at scale $SCALE"

      - name: System libraries for headless Chrome
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libpango-1.0-0 libcairo2 fonts-noto-color-emoji || true
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Render
        run: |
          node scripts/gen-registry.mjs
          node scripts/render-all.mjs --scale=${{ steps.pick.outputs.scale }} ${{ steps.pick.outputs.shot }}
          ls -la out

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pick.outputs.shot }}
          path: remotion/out/*
          retention-days: 14

      - name: Publish as release (direct MP4 link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: render-${{ steps.pick.outputs.shot }}-${{ github.run_number }}
          name: ${{ steps.pick.outputs.shot }} (run ${{ github.run_number }})
          files: remotion/out/*
