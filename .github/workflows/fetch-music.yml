name: Fetch Jamendo music
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (true) or download and commit (false)"
        default: "true"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          ffmpeg -version >/dev/null 2>&1 || sudo apt-get install -y ffmpeg
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 tools/fetch_jamendo.py --dry-run
          else
            python3 tools/fetch_jamendo.py
          fi
      - name: Commit
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "studio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add media/library/music
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "library: music from Jamendo"
          git pull --rebase origin main
          git push origin main
